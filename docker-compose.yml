services:
  backend:
    build: ./backend
    image: sinanaqcan/prompterest-backend:latest
    container_name: sinan-backend
    restart: always
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN}
      CHAT_MODEL: ${CHAT_MODEL:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    networks:
      - sinan-internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /prompterest
    image: sinanaqcan/prompterest-frontend:latest
    container_name: sinan-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: always
    networks:
      - nginx-proxy
      - sinan-internal

networks:
  nginx-proxy:
    external: true
  sinan-internal:
    driver: bridge
